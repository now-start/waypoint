server:
  port: 18080

spring:
  datasource:
    url: jdbc:h2:mem:localdb;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true
  jmx:
    enabled: false
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

otel:
  sdk:
    disabled: true

waypoint:
  briefing:
    ai:
      default-provider: ${WAYPOINT_AI_CHAT_PROVIDER:ollama}
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_CHAT_MODEL:gemma4:e4b}
        temperature: 0.2
        top-p: 0.9
        top-k: 40
        repeat-penalty: 1.1
        num-ctx: 8192
        num-predict: 512
        keep-alive: 10m
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.2
        top-p: 0.9
        num-predict: 512
  tago:
    base-url: http://apis.data.go.kr/1613000
    service-key: ${TAGO_SERVICE_KEY:}
    city-code: 38010
    num-of-rows: 1000
    connect-timeout: 5s
    read-timeout: 20s
    collection:
      reference-data-fixed-delay: 24h
      reference-data-initial-delay: 24h
      location-fixed-delay: 1m
      location-initial-delay: 0s
      arrival-fixed-delay: 10m
      arrival-initial-delay: 2m
      reference-data-concurrency: 8
      location-concurrency: 8
      arrival-concurrency: 8
      arrival-max-stops-per-run: 30
      rate-limit: 15
  anomaly:
    headway-wide: 30m
    headway-narrow: 3m
    location-stale: 5m
