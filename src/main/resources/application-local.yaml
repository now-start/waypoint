server:
  port: 18080

spring:
  datasource:
    url: jdbc:h2:mem:localdb;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true
  jmx:
    enabled: false
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

otel:
  sdk:
    disabled: true

waypoint:
  tago:
    base-url: http://apis.data.go.kr/1613000
    service-key: ${TAGO_SERVICE_KEY:}
    city-name: ${TAGO_CITY_NAME:창원시}
    city-code: ${TAGO_CITY_CODE:38010}
    num-of-rows: 1000
    connect-timeout: 5s
    read-timeout: 20s
    collection:
      location-fixed-delay: 10s
      location-initial-delay: 0s
      reference-data-concurrency: 8
      location-concurrency: 8
      arrival-concurrency: 8
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}
  anomaly:
    headway-wide: 30m
    headway-narrow: 3m
    location-stale: 5m
