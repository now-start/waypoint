spring:
  application:
    name: waypoint
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:${waypoint.ollama.base-url:http://localhost:11434}}
      chat:
        options:
          model: ${OLLAMA_MODEL:${waypoint.ollama.model:llama3.1}}
          temperature: 0.2

---

spring:
  config:
    activate:
      on-profile: "!local"
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:https://spring.nowstart.org/config}
